services:

  # ─── MySQL ───────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: bmtmas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass123}
      MYSQL_DATABASE: ${DB_NAME:-bmtmas}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (Express API) ───────────────────────────────
  backend:
    build:
      context: ./server
    container_name: bmtmas-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rootpass123}
      DB_NAME: ${DB_NAME:-bmtmas}
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-BismillahAlhamdulillahAllahuakbar}
      JWT_EXPIRES: ${JWT_EXPIRES:-2h}
    volumes:
      - backend-uploads:/app/uploads

  # ─── Frontend (nginx) ────────────────────────────────────
  frontend:
    build: .
    container_name: bmtmas-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  backend-uploads:
